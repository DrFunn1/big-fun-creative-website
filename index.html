<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Fun Creative - Interactive Art Installations</title>
  
<!-- Open Graph Meta Tags for Link Previews -->
  <meta property="og:title" content="Big Fun Creative - Interactive Art Installations">
  <meta property="og:description" content="Transforming spaces into delightful places of shared play and connection through unique large-scale interactive art">
  <meta property="og:image" content="https://big-fun-creative.com/assets/images/shrooms-card.webp">
  <meta property="og:url" content="https://big-fun-creative.com">
  <meta property="og:type" content="website">
  
  <!-- Twitter Card Meta Tags (optional but recommended) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Big Fun Creative - Interactive Art Installations">
  <meta name="twitter:description" content="Transforming spaces into delightful places of shared play and connection">
  <meta name="twitter:image" content="https://big-fun-creative.com/assets/images/shrooms-card.webp">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  
</head>
<body>
  
  <!-- Main Content -->
  <header id="projects">
    <img src="assets/images/BFC-logo-light-rectangle-sharp.svg" alt="Big Fun Creative Logo" class="logo">
    <h2 class="home-headline">
     Transforming spaces into delightful places<br>
      of shared play and connection through<br>
      unique large-scale interactive art
    </h2>
  </header>

  <main class="content-section">
    <h2 class="section-title">Featured Projects</h2>
    
    <div class="project-grid">
      <a href="projects/shrooms.html" class="project-card">
        <img src="assets/images/shrooms-card.webp" alt="Serene Shrooms">
        <div class="project-info">
          <p>Serene Shrooms</p>
        </div>
      </a>

      <a href="projects/bigpixel.html" class="project-card">
        <img src="assets/images/bigpixel-card.webp" alt="BigPixel Display">
        <div class="project-info">
          <p>BigPixel Display</p>
        </div>
      </a>

      <a href="projects/starlords.html" class="project-card">
        <img src="assets/images/starlords-card.webp" alt="StarLords">
        <div class="project-info">
          <p>StarLords</p>
        </div>
      </a>

      <a href="projects/lucky-13.html" class="project-card">
        <img src="assets/images/lucky-13-card.webp" alt="Lucky 13">
        <div class="project-info">
          <p>Lucky 13</p>
        </div>
      </a>

      <a href="projects/gmmdr.html" class="project-card">
        <img src="assets/images/gmmdr-card.webp" alt="Giant Marble Machine Drag Race">
        <div class="project-info">
          <p>Giant Marble Machine <br>Drag Race</p>
        </div>
      </a>

      <a href="projects/tunnel.html" class="project-card">
        <img src="assets/images/ghost-tunnel-card.webp" alt="Ghost Tunnel">
        <div class="project-info">
          <p>Ghost Tunnel</p>
        </div>
      </a>

      <a href="projects/scrabble.html" class="project-card">
        <img src="assets/images/scrabble-card.webp" alt="Big Scrabble Tiles">
        <div class="project-info">
          <p>Big Scrabble</p>
        </div>
      </a>

      <a href="projects/table-spiral.html" class="project-card">
        <img src="assets/images/table-spiral-card.webp" alt="Table Spiral">
        <div class="project-info">
          <p>Table Spiral</p>
        </div>
      </a>
      
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer-placeholder"></div>

  <script>
    fetch('./footer-home.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
        
        // Initialize contact modal and form after footer loads
        const contactButton = document.getElementById('contact-button');
        const modal = document.getElementById('contact-modal');
        const closeButton = document.getElementById('close-modal');
        const form = document.getElementById('contact-form');
        const formStatus = document.getElementById('form-status');
        
        if (contactButton && modal && closeButton && form) {
          // Open modal when contact button is clicked
          contactButton.addEventListener('click', function(e) {
            e.preventDefault();
            modal.style.display = 'flex';
          });
          
          // Close modal when X is clicked
          closeButton.addEventListener('click', function() {
            modal.style.display = 'none';
            form.reset();
            formStatus.style.display = 'none';
          });
          
          // Close modal when clicking outside the form
          modal.addEventListener('click', function(e) {
            if (e.target === modal) {
              modal.style.display = 'none';
              form.reset();
              formStatus.style.display = 'none';
            }
          });
          
          // Close modal on Escape key
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
              modal.style.display = 'none';
              form.reset();
              formStatus.style.display = 'none';
            }
          });
          
          // Handle form submission with AJAX
          form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const submitButton = form.querySelector('button[type="submit"]');
            
            // Disable submit button and show loading state
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';
            formStatus.style.display = 'none';
            
            fetch(form.action, {
              method: 'POST',
              body: formData,
              headers: {
                'Accept': 'application/json'
              }
            })
            .then(response => {
              if (response.ok) {
                // Success
                formStatus.style.display = 'block';
                formStatus.style.backgroundColor = '#d4edda';
                formStatus.style.color = '#155724';
                formStatus.textContent = 'Thank you! Your message has been sent successfully.';
                form.reset();
                
                // Close modal after 2 seconds
                setTimeout(function() {
                  modal.style.display = 'none';
                  formStatus.style.display = 'none';
                }, 2000);
              } else {
                throw new Error('Form submission failed');
              }
            })
            .catch(error => {
              // Error
              formStatus.style.display = 'block';
              formStatus.style.backgroundColor = '#f8d7da';
              formStatus.style.color = '#721c24';
              formStatus.textContent = 'Oops! There was a problem sending your message. Please try again.';
            })
            .finally(() => {
              // Re-enable submit button
              submitButton.disabled = false;
              submitButton.textContent = 'Send Message';
            });
          });
        }
      })
      .catch(error => {
        console.error('Error loading footer:', error);
      });
  </script>
</body>
</html>
